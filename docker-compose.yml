version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: course-central-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    # Uncomment baris di bawah jika Anda perlu mengakses DB dari luar Docker (misalnya dengan DBeaver)
    # ports:
    #   - "3306:3306"

  course-central:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: course-central-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Variabel untuk koneksi DB dari dalam aplikasi
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE}
    depends_on:
      - db

volumes:
  mysql_data:
